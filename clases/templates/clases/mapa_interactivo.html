
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mapa Interactivo - Aprenduiz</title>

    <!-- LEAFLET CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 1100px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
            font-weight: bold;
        }

        #mapa {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            border: 2px solid #dbeafe;
            z-index: 1;
        }

        .buscador {
            max-width: 700px;
            margin: 25px auto;
        }

        .informacion {
            background: #eff6ff;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .btn-principal {
            background: #2563eb;
            color: white;
        }

        .btn-principal:hover {
            background: #1d4ed8;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="contenedor">

        <h1>🗺️ Mapa Interactivo</h1>

        <p class="text-center text-muted">
            Explora ciudades y selecciona ubicaciones.
        </p>


        <!-- BUSCADOR DE CIUDADES -->

        <div class="buscador">

            <form id="formularioBusqueda">

                <div class="input-group">

                    <input
                        type="text"
                        id="ciudad"
                        class="form-control"
                        placeholder="Buscar ciudad. Ejemplo: Bogotá"
                        required
                    >

                    <button
                        type="submit"
                        class="btn btn-principal">

                        🔍 Buscar

                    </button>

                </div>

            </form>

            <div id="mensaje" class="mt-2"></div>

        </div>


        <!-- BOTON PARA VOLVER A COLOMBIA -->

        <div class="mb-3">

            <button
                class="btn btn-outline-primary"
                onclick="volverColombia()">

                🇨🇴 Ver Colombia

            </button>

        </div>


        <!-- MAPA -->

        <div id="mapa"></div>


        <!-- INFORMACION DE UBICACION -->

        <div class="informacion">

            <h5>📍 Ubicación seleccionada</h5>

            <p id="coordenadas">
                Haz clic sobre el mapa para seleccionar
                una ubicación.
            </p>

        </div>


        <div class="text-center mt-4">

            <a href="/" class="btn btn-secondary">
                Volver al inicio
            </a>

        </div>

    </div>

</div>


<!-- LEAFLET JAVASCRIPT -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    // =====================================
    // 1. CREAR MAPA
    // =====================================

    var mapa = L.map('mapa').setView(
        [4.5709, -74.2973],
        6
    );


    // =====================================
    // 2. CARGAR MAPAS OPENSTREETMAP
    // =====================================

   L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,

        referrerPolicy: 'strict-origin-when-cross-origin',

        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
).addTo(mapa);


    // =====================================
    // 3. VARIABLES
    // =====================================

    var marcador = null;


    // =====================================
    // 4. SELECCIONAR UBICACION CON CLIC
    // =====================================

    mapa.on('click', function(evento) {

        var latitud = evento.latlng.lat;

        var longitud = evento.latlng.lng;


        if (marcador) {

            mapa.removeLayer(marcador);

        }


        marcador = L.marker([
            latitud,
            longitud
        ]).addTo(mapa);


        marcador.bindPopup(
            "Ubicación seleccionada"
        ).openPopup();


        document.getElementById(
            'coordenadas'
        ).innerHTML =
            "Latitud: " + latitud.toFixed(5) +
            "<br>Longitud: " + longitud.toFixed(5);

    });


    // =====================================
    // 5. BUSCAR CIUDADES
    // =====================================

    document.getElementById(
        'formularioBusqueda'
    ).addEventListener('submit', async function(evento) {

        evento.preventDefault();

        var ciudad = document.getElementById(
            'ciudad'
        ).value.trim();


        var mensaje = document.getElementById(
            'mensaje'
        );

        if (!ciudad) {
            mensaje.innerHTML =
                '<div class="alert alert-warning">Escribe una ciudad.</div>';
            return;
        }

        mensaje.innerHTML =
            '<div class="alert alert-info">Buscando ubicación...</div>';


        try {

            // Consultar servicio de geocodificación
            // de OpenStreetMap

            var url =
                'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='
                + encodeURIComponent(ciudad);


            var respuesta = await fetch(url, {
                headers: {
                    'Accept': 'application/json'
                }
            });


            if (!respuesta.ok) {
                throw new Error(
                    'El servicio de búsqueda respondió: ' +
                    respuesta.status
                );
            }


            var datos = await respuesta.json();


            if (datos.length === 0) {

                mensaje.innerHTML =
                    '<div class="alert alert-warning">No encontramos esa ciudad.</div>';

                return;

            }


            var latitud = parseFloat(datos[0].lat);

            var longitud = parseFloat(datos[0].lon);


            // Centrar mapa en la ciudad

            mapa.setView(
                [latitud, longitud],
                13
            );


            // Eliminar marcador anterior

            if (marcador) {

                mapa.removeLayer(marcador);

            }


            // Agregar marcador nuevo

            marcador = L.marker([
                latitud,
                longitud
            ]).addTo(mapa);


            marcador.bindPopup(
                '<b>' + ciudad + '</b>'
            ).openPopup();


            document.getElementById(
                'coordenadas'
            ).innerHTML =
                'Latitud: ' + latitud.toFixed(5) +
                '<br>Longitud: ' + longitud.toFixed(5);


            mensaje.innerHTML =
                '<div class="alert alert-success">Ubicación encontrada correctamente.</div>';


        } catch(error) {

            mensaje.innerHTML =
                '<div class="alert alert-danger">' +
                'Error al buscar la ciudad: ' +
                error.message +
                '</div>';

            console.error(error);

        }

    });


    // =====================================
    // 6. VOLVER A COLOMBIA
    // =====================================

    function volverColombia() {

        mapa.setView(
            [4.5709, -74.2973],
            6
        );

        if (marcador) {

            mapa.removeLayer(marcador);

            marcador = null;

        }

        document.getElementById(
            'coordenadas'
        ).innerHTML =
            'Haz clic sobre el mapa para seleccionar una ubicación.';

        document.getElementById(
            'mensaje'
        ).innerHTML = '';

    }

</script>

</body>

</html>
